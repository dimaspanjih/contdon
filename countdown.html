<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown Promo Payday</title>

<style>
  html,
  body {
    margin: 0;
    padding: 0;
    background: transparent !important;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  .countdown-wrapper {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 9999;
    width: 140px;
    background: transparent;
  }

  .countdown {
    width: 140px;
    box-sizing: border-box;
    text-align: center;
    background: #d81f26;
    color: #ffffff;
    font-family: Arial, sans-serif;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 0.5px;
    padding: 4px 0;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
</style>
</head>

<body>

<div id="countdown-wrapper" class="countdown-wrapper">
  <div id="countdown" class="countdown">00:00:00</div>
</div>

<script>
(function() {
  const countdownEl = document.getElementById("countdown");

  const FOUR_HOURS = 4 * 60 * 60 * 1000;
  const STORAGE_KEY = "tempo_countdown_end";

  let endTime = localStorage.getItem(STORAGE_KEY);

  // Kalau belum ada countdown, mulai 4 jam
  if (!endTime) {
    endTime = Date.now() + THREE_HOURS;
    localStorage.setItem(STORAGE_KEY, endTime);
  } else {
    endTime = parseInt(endTime);
  }

  function updateCountdown() {
    const remaining = endTime - Date.now();

    // Countdown habis → mulai lagi 4 jam
    if (remaining <= 0) {
      endTime = Date.now() + FOUR_HOURS;
      localStorage.setItem(STORAGE_KEY, endTime);
    }

    const totalSeconds = Math.max(
      0,
      Math.floor((endTime - Date.now()) / 1000)
    );

    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    const pad = (n) => n.toString().padStart(2, "0");

    countdownEl.innerHTML =
      `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
})();
</script>

</body>
</html>
